name: Build Windows Shipping

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Unreal Engine
        shell: powershell
        run: |
          $candidates = @(
            $env:UE_ROOT,
            'C:\Program Files\Epic Games\UE_5.8',
            'D:\Epic Games\UE_5.8',
            'D:\Program Files\Epic Games\UE_5.8'
          ) | Where-Object { $_ }

          $ueRoot = $null
          foreach ($candidate in $candidates) {
            if (Test-Path (Join-Path $candidate 'Engine\Build\BatchFiles\RunUAT.bat')) {
              $ueRoot = $candidate
              break
            }
          }

          if (-not $ueRoot) {
            throw 'Unreal Engine 5.8.x was not found. Set UE_ROOT on the self-hosted runner or install UE 5.8.x in a standard Epic Games location.'
          }

          "UE_ROOT=$ueRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Unreal Engine at $ueRoot"

      - name: Package Windows Shipping build
        shell: powershell
        run: |
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'TheForbiddenGates.uproject'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'Artifacts\Windows'
          New-Item -ItemType Directory -Force -Path $archive | Out-Null

          & $uat BuildCookRun `
            -project="$project" `
            -noP4 `
            -utf8output `
            -platform=Win64 `
            -clientconfig=Shipping `
            -build `
            -cook `
            -stage `
            -pak `
            -archive `
            -archivedirectory="$archive"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Get-ChildItem -Path $archive -Filter '*.exe' -Recurse | Where-Object { $_.Name -notmatch 'CrashReportClient|UnrealPrereq' } | Select-Object -First 1
          if (-not $exe) { throw 'Packaging completed but no game EXE was found in the archive.' }
          Write-Host "Packaged game executable: $($exe.FullName)"

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: the-forbidden-gates-windows-shipping
          path: Artifacts/Windows/**
          if-no-files-found: error
          retention-days: 30
